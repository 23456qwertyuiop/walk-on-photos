name: Build All Platforms

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: walk-on-photos-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: walk-on-photos-web
          path: build/web

  linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev unzip
      - name: Install ONNX Runtime 1.28.0 from NuGet
        run: |
          curl -sL -o /tmp/ort.nupkg \
            https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.28.0/microsoft.ml.onnxruntime.1.28.0.nupkg
          unzip -q /tmp/ort.nupkg "build/native/include/*" "runtimes/linux-x64/native/*" -d /tmp/ort
          sudo cp -r /tmp/ort/build/native/include/* /usr/local/include/
          sudo cp -r /tmp/ort/runtimes/linux-x64/native/* /usr/local/lib/
          sudo mkdir -p /usr/local/lib/pkgconfig
          cat <<'EOF' | sudo tee /usr/local/lib/pkgconfig/onnxruntime.pc
          prefix=/usr/local
          libdir=${prefix}/lib
          includedir=${prefix}/include

          Name: onnxruntime
          Description: ONNX Runtime
          Version: 1.28.0
          Libs: -L${libdir} -lonnxruntime
          Cflags: -I${includedir}
          EOF
          sudo ldconfig
          rm -rf /tmp/ort /tmp/ort.nupkg
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Archive Linux bundle
        run: |
          mkdir -p dist
          cp /usr/local/lib/libonnxruntime.so* build/linux/x64/release/bundle/lib/
          tar -czf dist/walk-on-photos-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: walk-on-photos-linux-x64
          path: dist/walk-on-photos-linux-x64.tar.gz

  windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ONNX Runtime 1.28.0 from NuGet
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.28.0/microsoft.ml.onnxruntime.1.28.0.nupkg" -OutFile "$env:TEMP\ort.zip"
          Expand-Archive -Path "$env:TEMP\ort.zip" -DestinationPath "$env:TEMP\ort" -Force
          New-Item -ItemType Directory -Force -Path "C:\onnxruntime\include", "C:\onnxruntime\lib" | Out-Null
          Copy-Item -Path "$env:TEMP\ort\build\native\include\*" -Destination "C:\onnxruntime\include" -Recurse -Force
          Copy-Item -Path "$env:TEMP\ort\runtimes\win-x64\native\*" -Destination "C:\onnxruntime\lib" -Recurse -Force
          Remove-Item -Recurse -Force "$env:TEMP\ort", "$env:TEMP\ort.zip"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Windows release
        env:
          INCLUDE: C:\onnxruntime\include
          LIB: C:\onnxruntime\lib
        run: flutter build windows --release
      - name: Copy ONNX Runtime DLL
        shell: pwsh
        run: Copy-Item -Path "C:\onnxruntime\lib\*.dll" -Destination "build\windows\x64\runner\Release\" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: walk-on-photos-windows-x64
          path: build/windows/x64/runner/Release

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch onnxruntime-swift-package-manager (drop dead onnxruntime_extensions URL)
        run: |
          git clone --depth 1 --branch 1.28.0 https://github.com/masicai/onnxruntime-swift-package-manager.git /tmp/ort-spm
          cd /tmp/ort-spm
          python3 - <<'PY'
          import re
          with open('Package.swift', 'r') as f:
              s = f.read()
          s = re.sub(r'\.library\(name:\s*"onnxruntime_extensions".*?\),\s*', '', s, flags=re.S)
          s = re.sub(r'\.target\(name:\s*"OnnxRuntimeExtensions".*?\),\s*', '', s, flags=re.S)
          s = re.sub(r'\.testTarget\(name:\s*"OnnxRuntimeExtensionsTests".*?\),\s*', '', s, flags=re.S)
          marker = 'if let ext_pod_archive_path'
          if marker in s:
              s = s[:s.index(marker)]
          with open('Package.swift', 'w') as f:
              f.write(s)
          PY
          git config user.name "ci"
          git config user.email "ci@example.com"
          git commit -am "Drop unused onnxruntime_extensions target"
          git tag -f 1.28.0
          git config --global url."file:///tmp/ort-spm".insteadOf "https://github.com/masicai/onnxruntime-swift-package-manager"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/walk_on_photos.app \
            dist/walk-on-photos-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: walk-on-photos-macos
          path: dist/walk-on-photos-macos.zip

  ios:
    name: Build iOS (Unsigned IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch onnxruntime-swift-package-manager (drop dead onnxruntime_extensions URL)
        run: |
          git clone --depth 1 --branch 1.28.0 https://github.com/masicai/onnxruntime-swift-package-manager.git /tmp/ort-spm
          cd /tmp/ort-spm
          python3 - <<'PY'
          import re
          with open('Package.swift', 'r') as f:
              s = f.read()
          s = re.sub(r'\.library\(name:\s*"onnxruntime_extensions".*?\),\s*', '', s, flags=re.S)
          s = re.sub(r'\.target\(name:\s*"OnnxRuntimeExtensions".*?\),\s*', '', s, flags=re.S)
          s = re.sub(r'\.testTarget\(name:\s*"OnnxRuntimeExtensionsTests".*?\),\s*', '', s, flags=re.S)
          marker = 'if let ext_pod_archive_path'
          if marker in s:
              s = s[:s.index(marker)]
          with open('Package.swift', 'w') as f:
              f.write(s)
          PY
          git config user.name "ci"
          git config user.email "ci@example.com"
          git commit -am "Drop unused onnxruntime_extensions target"
          git tag -f 1.28.0
          git config --global url."file:///tmp/ort-spm".insteadOf "https://github.com/masicai/onnxruntime-swift-package-manager"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p dist Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q dist/walk-on-photos-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: walk-on-photos-ios-unsigned
          path: dist/walk-on-photos-ios-unsigned.ipa
